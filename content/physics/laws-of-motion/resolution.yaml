concept: resolution
questions:
  - id: res-d01
    type: mcq
    difficulty: easy
    expected_seconds: 90
    pool: diagnostic
    stem: A block of mass $2\,\text{kg}$ rests on a rough incline of angle $30^\circ$. What is the frictional force acting on the block?
    options:
      - key: A
        text: $10\sqrt{3}\,\text{N}$
      - key: B
        text: $10\,\text{N}$
      - key: C
        text: $20\,\text{N}$
      - key: D
        text: $5\,\text{N}$
    answer: B
    solution:
      - "At rest, friction balances the component of weight along the incline: $f = mg\\sin 30^\\circ = 2 \\times 10 \\times 0.5 = 10\\,\\text{N}$. The value $mg\\cos 30^\\circ = 10\\sqrt{3}\\,\\text{N}$ is the component *into* the surface, which the normal force balances."
  - id: res-d02
    type: mcq
    difficulty: easy
    expected_seconds: 90
    pool: diagnostic
    stem: A block of mass $4\,\text{kg}$ is placed on a smooth incline of angle $60^\circ$. What is the normal force exerted by the incline?
    options:
      - key: A
        text: $20\,\text{N}$
      - key: B
        text: $20\sqrt{3}\,\text{N}$
      - key: C
        text: $40\,\text{N}$
      - key: D
        text: $10\,\text{N}$
    answer: A
    solution:
      - "The normal force balances the weight component perpendicular to the surface: $N = mg\\cos 60^\\circ = 40 \\times 0.5 = 20\\,\\text{N}$."
  - id: res-d03
    type: numerical
    difficulty: medium
    expected_seconds: 90
    pool: diagnostic
    stem: A box is pulled by a rope with a force of $50\,\text{N}$ at $37^\circ$ above the horizontal. Find the horizontal component of the force, in newtons.
    answer:
      value: 40
      tolerance: 0.01
    solution:
      - "The horizontal component is adjacent to the $37^\\circ$ angle: $F_x = 50\\cos 37^\\circ = 50 \\times 0.8 = 40\\,\\text{N}$."
  - id: res-p01
    type: mcq
    difficulty: easy
    expected_seconds: 60
    pool: practice
    stem: "A $10\\,\\text{kg}$ block sits on a smooth incline of $30^\\circ$. The component of its weight along the incline is:"
    options:
      - key: A
        text: $50\,\text{N}$
      - key: B
        text: $50\sqrt{3}\,\text{N}$
      - key: C
        text: $100\,\text{N}$
      - key: D
        text: $25\,\text{N}$
    answer: A
    solution:
      - "$mg\\sin 30^\\circ = 100 \\times 0.5 = 50\\,\\text{N}$. Remember: along the incline is $\\sin\\theta$, into the surface is $\\cos\\theta$."
    hint: Along the incline you want the component *opposite* the angle $\theta$ in the weight triangle.
  - id: res-p02
    type: numerical
    difficulty: easy
    expected_seconds: 60
    pool: practice
    stem: A $5\,\text{kg}$ block rests on an incline of $37^\circ$. Find the normal force, in newtons.
    answer:
      value: 40
      tolerance: 0.01
    solution:
      - $N = mg\cos 37^\circ = 50 \times 0.8 = 40\,\text{N}$.
    hint: The normal force balances the component of weight *into* the surface.
  - id: res-p03
    type: numerical
    difficulty: medium
    expected_seconds: 90
    pool: practice
    stem: A $4\,\text{kg}$ block is held at rest on a smooth $30^\circ$ incline by a force parallel to the incline. Find that force, in newtons.
    answer:
      value: 20
      tolerance: 0.01
    solution:
      - $F = mg\sin 30^\circ = 40 \times 0.5 = 20\,\text{N}$.
    hint: With no friction, the applied force alone must cancel $mg\sin\theta$.
  - id: res-p04
    type: mcq
    difficulty: medium
    expected_seconds: 60
    pool: practice
    stem: As the angle of a smooth incline increases from $0^\circ$ towards $90^\circ$, what happens to the two weight components on a block?
    options:
      - key: A
        text: Both increase
      - key: B
        text: Along-incline increases, normal decreases
      - key: C
        text: Along-incline decreases, normal increases
      - key: D
        text: Both stay the same
    answer: B
    solution:
      - $mg\sin\theta$ grows from $0$ to $mg$ while $mg\cos\theta$ falls from $mg$ to $0$.
    hint: "Check the extremes: what are $\\sin\\theta$ and $\\cos\\theta$ at $0^\\circ$ and $90^\\circ$?"
  - id: res-p05
    type: numerical
    difficulty: medium
    expected_seconds: 60
    pool: practice
    stem: A $6\,\text{kg}$ block is on a smooth incline of $53^\circ$. Find the component of its weight along the incline, in newtons.
    answer:
      value: 48
      tolerance: 0.01
    solution:
      - $mg\sin 53^\circ = 60 \times 0.8 = 48\,\text{N}$.
    hint: Use $\sin 53^\circ = 0.8$.
  - id: res-r01
    type: mcq
    difficulty: easy
    expected_seconds: 90
    pool: retest
    stem: "A $3\\,\\text{kg}$ block rests on an incline of $30^\\circ$. The normal force on it is:"
    options:
      - key: A
        text: $15\,\text{N}$
      - key: B
        text: $15\sqrt{3}\,\text{N}$
      - key: C
        text: $30\,\text{N}$
      - key: D
        text: $30\sqrt{3}\,\text{N}$
    answer: B
    solution:
      - $N = mg\cos 30^\circ = 30 \times \tfrac{\sqrt3}{2} = 15\sqrt{3}\,\text{N}$.
  - id: res-r02
    type: numerical
    difficulty: medium
    expected_seconds: 90
    pool: retest
    stem: A force of $100\,\text{N}$ acts at $53^\circ$ above the horizontal. Find its vertical component, in newtons.
    answer:
      value: 80
      tolerance: 0.01
    solution:
      - $F_y = 100\sin 53^\circ = 80\,\text{N}$.
  - id: res-r03
    type: numerical
    difficulty: medium
    expected_seconds: 90
    pool: retest
    stem: An $8\,\text{kg}$ block slides down a smooth $37^\circ$ incline. Find its acceleration, in $\text{m/s}^2$.
    answer:
      value: 6
      tolerance: 0.01
    solution:
      - $a = g\sin 37^\circ = 10 \times 0.6 = 6\,\text{m/s}^2$.
